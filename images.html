<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Robotics Proof Media sub-page</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                font-family: Arial, sans-serif;
                background: #0b0f14;
                color: #e8f1ff;
            }
            header {
                text-align: center;
                padding: 50px 20px 35px;
                background: radial-gradient(circle at top, #17365c 0%, #0b0f14 65%);
            }
            header h1 {
                margin: 0;
                font-size: 3em;
                letter-spacing: 3px;
                text-transform: uppercase;
            }
            header p {
                color: #8fa8c7;
                font-size: 1.1em;
                margin-top: 12px;
            }
            .line {
                width: 100px;
                height: 4px;
                margin: 20px auto 0;
                background: #4da6ff;
                border-radius: 10px;
            }
            .projects {
                max-width: 1100px;
                margin: 40px auto;
                padding: 0 20px;
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
                gap: 25px;
            }
            .card {
                background: #111821;
                border: 1px solid #26384d;
                border-radius: 18px;
                padding: 18px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
                transition:
                    transform 0.25s ease,
                    border-color 0.25s ease,
                    box-shadow 0.25s ease;
            }
            .card:hover {
                transform: translateY(-7px);
                border-color: #4da6ff;
                box-shadow: 0 15px 40px rgba(77, 166, 255, 0.18);
            }
            .card h2 {
                margin: 5px 0 15px;
                font-size: 1.35em;
            }
            .card h2::before {
                content: "▸ ";
                color: #4da6ff;
            }
            video {
                width: 100%;
                aspect-ratio: 16 / 9;
                object-fit: cover;
                border-radius: 12px;
                background: #05070a;
                border: 1px solid #1e2b3a;
            }
            .hero-image {
                display: block;
                width: min(700px, 90%);
                max-height: 400px;
                object-fit: contain;
                margin: 0 auto 25px;
                border-radius: 18px;
                border: 1px solid #26384d;
                box-shadow: 0 15px 40px rgba(0, 0, 0, 0.45);
            }
            footer {
                text-align: center;
                padding: 35px 20px;
                color: #647891;
                font-size: 0.9em;
            }
            @media (max-width: 600px) {
                header h1 {
                    font-size: 2.2em;
                }
                .projects {
                    grid-template-columns: 1fr;
                }
            }
        </style>
    </head>
    <body>
        <header>
            <img class="hero-image" src="SoundStream.heic" alt="Sound Stream" />
            <h1>Sound Stream</h1>
            <p>Embedded systems • Wireless communication • Computer vision</p>
            <div class="line"></div>
        </header>
        <main class="projects">
            <section class="card">
                <h2>Web Server</h2>
                <video controls>
                    <source src="./videos/WebServer.mp4" type="video/mp4" />
                    Your browser does not support video playback.
                </video>
            </section>
            <section class="card">
                <h2>Bluetooth Low Energy</h2>
                <video controls>
                    <source src="./videos/BLE.mp4" type="video/mp4" />
                    Your browser does not support video playback.
                </video>
            </section>
            <section class="card">
                <h2>On-Device Vision Model</h2>
                <video controls>
                    <source src="./videos/OnDeviceVisionModel.mp4" type="video/mp4" />
                    Your browser does not support video playback.
                </video>
            </section>
            <section class="card">
                <h2>LoRa P2P</h2>
                <video controls>
                    <source src="./videos/LoRa_P2P.mov" type="video/quicktime" />
                    Your browser does not support video playback.
                </video>
            </section>
        </main>
        <footer>Sound Stream • Embedded Systems Project</footer>
    </body>
</html>
