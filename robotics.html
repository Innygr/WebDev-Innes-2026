<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crystal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050508;
      color: white;
      font-family: system-ui, sans-serif;
    }

    #scene {
      position: fixed;
      inset: 0;
    }

    .videos {
      position: fixed;
      left: 24px;
      bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }

    .videos a {
      color: #d9eaff;
      text-decoration: none;
      font-size: 14px;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .videos a:hover {
      opacity: 1;
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div id="scene"></div>

  <!-- Replace these paths with the videos in your repository. -->
  <nav class="videos">
    <a href="./videos/video-01.mp4">Video 01</a>
    <a href="./videos/BLE.mp4">BLE</a>
    <a href="./videos/OnDeviceVisionModel.mp4">On Device Vision Model</a>
  </nav>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050508);

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(0, 0, 5);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    document.querySelector("#scene").appendChild(renderer.domElement);

    // Crystal geometry
    const geometry = new THREE.IcosahedronGeometry(1.35, 1);

    const material = new THREE.MeshPhysicalMaterial({
      color: 0x78bfff,
      roughness: 0.08,
      metalness: 0.05,
      transmission: 0.35,
      thickness: 1.2,
      transparent: true,
      opacity: 0.88,
      flatShading: true
    });

    const crystal = new THREE.Mesh(geometry, material);
    scene.add(crystal);

    // Subtle inner crystal
    const innerGeometry = new THREE.IcosahedronGeometry(0.95, 1);
    const innerMaterial = new THREE.MeshBasicMaterial({
      color: 0x8ed8ff,
      wireframe: true,
      transparent: true,
      opacity: 0.18
    });

    const innerCrystal = new THREE.Mesh(innerGeometry, innerMaterial);
    scene.add(innerCrystal);

    // Lighting
    scene.add(new THREE.AmbientLight(0x6688aa, 1.5));

    const keyLight = new THREE.PointLight(0xffffff, 80, 20);
    keyLight.position.set(3, 4, 5);
    scene.add(keyLight);

    const blueLight = new THREE.PointLight(0x3388ff, 50, 15);
    blueLight.position.set(-4, -2, 3);
    scene.add(blueLight);

    const purpleLight = new THREE.PointLight(0x8844ff, 35, 15);
    purpleLight.position.set(2, -4, -3);
    scene.add(purpleLight);

    // Non-interactive animation
    function animate() {
      requestAnimationFrame(animate);

      crystal.rotation.x += 0.003;
      crystal.rotation.y += 0.006;

      innerCrystal.rotation.x -= 0.002;
      innerCrystal.rotation.y -= 0.004;

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
