name: Unpack ZIPs and update Proof Hub

on:
  push:
    paths:
      - '**.zip'
      - '**/*.zip'
      - '**/*.mp4'
      - '**/*.mov'
      - '**/*.webm'
      - '**/*.m4v'
      - '**/*.ogv'
      - '**/*.mkv'
      - '**/*.avi'
      - '**/*.flv'
      - '**/*.wmv'
      - '**/*.mpeg'
      - '**/*.mpg'
      - '**/*.mts'
      - '**/*.3gp'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.webp'
      - '**/*.avif'
      - '**/*.svg'
      - '**/*.bmp'
      - '**/*.tif'
      - '**/*.tiff'
      - '**/*.heic'
      - '**/*.heif'
      - '**/*.3fr'
      - '**/*.ari'
      - '**/*.arw'
      - '**/*.bay'
      - '**/*.cap'
      - '**/*.cr2'
      - '**/*.cr3'
      - '**/*.dcs'
      - '**/*.dcr'
      - '**/*.dng'
      - '**/*.drf'
      - '**/*.eip'
      - '**/*.erf'
      - '**/*.fff'
      - '**/*.gpr'
      - '**/*.iiq'
      - '**/*.k25'
      - '**/*.kdc'
      - '**/*.mdc'
      - '**/*.mef'
      - '**/*.mos'
      - '**/*.mrw'
      - '**/*.nef'
      - '**/*.nrw'
      - '**/*.orf'
      - '**/*.pef'
      - '**/*.ptx'
      - '**/*.pxn'
      - '**/*.r3d'
      - '**/*.raf'
      - '**/*.raw'
      - '**/*.rwl'
      - '**/*.rw2'
      - '**/*.rwz'
      - '**/*.sr2'
      - '**/*.srf'
      - '**/*.srw'
      - '**/*.x3f'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proof-hub-zip-import
  cancel-in-progress: false

jobs:
  import-media:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install media conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-venv
          python3 -m venv /tmp/proof-hub-venv
          /tmp/proof-hub-venv/bin/pip install --upgrade pip Pillow pillow-avif-plugin pillow-heif rawpy

      - name: Unpack ZIPs, move uploads, convert media, and register files
        env:
          UPLOAD_BASE_SHA: ${{ github.event.before }}
        run: /tmp/proof-hub-venv/bin/python .github/scripts/import-proof-media.py

      - name: Commit extracted files and Proof Hub updates
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Unpack ZIP uploads and update Proof Hub"
            git push
          else
            echo "Nothing to import."
          fi
