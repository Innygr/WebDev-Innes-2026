name: Build and deploy website

on:
  push:
    branches:
      - main
    paths:
      # Only run when something that can affect the published site changes.
      - '**.html'
      - '**.css'
      - '**.js'
      - '**.mjs'
      - '**.cjs'
      - '**.json'
      - '**.xml'
      - '**.txt'
      - '**.webmanifest'
      - '**.svg'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.gif'
      - '**.webp'
      - '**.avif'
      - '**.bmp'
      - '**.tif'
      - '**.tiff'
      - '**.heic'
      - '**.heif'
      - '**.mp4'
      - '**.mov'
      - '**.webm'
      - '**.m4v'
      - '**.ogv'
      - '**.mp3'
      - '**.wav'
      - '**.ogg'
      - '**.m4a'
      - '**.pdf'
      - '**.woff'
      - '**.woff2'
      - '**.ttf'
      - '**.otf'
      - '.nojekyll'
      - 'CNAME'
      - '.well-known/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Stage and publish changed site
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage static website
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.venv/' \
            --exclude='_site/' \
            ./ _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
