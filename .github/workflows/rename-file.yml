name: Rename file and update references

on:
  workflow_dispatch:
    inputs:
      file_path:
        description: Repository path of the file to rename (for example, images/photo.png)
        required: true
        type: string
      new_name:
        description: New filename (extension is kept if you omit it)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: manual-file-rename
  cancel-in-progress: false

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rename file and update references
        env:
          FILE_PATH: ${{ inputs.file_path }}
          NEW_NAME: ${{ inputs.new_name }}
        run: python3 .github/scripts/rename-references.py "$FILE_PATH" "$NEW_NAME"

      - name: Commit rename and reference updates
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Rename file and update references"
            git push
          else
            echo "Nothing to rename."
          fi
